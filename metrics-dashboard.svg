<svg width="100%" height="195" viewBox="0 0 850 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC80F" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>

    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <style><![CDATA[
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #FFC80F;
      }
      .item-label {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        fill: #E6EDF3;
      }
      .item-value {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #8B949E;
      }
      .pulse-dot {
        animation: pulseBeacon 2s infinite ease-in-out;
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- ==================== LEFT CARD: MOST USED LANGUAGES (x: 0, width: 415, height: 195) ==================== -->
  <g transform="translate(0, 0)">
    <!-- Base Frame -->
    <rect width="415" height="195" rx="6" fill="url(#card-bg)" stroke="#30363D" stroke-width="1" />

    <!-- Title -->
    <g transform="translate(20, 32)">
      <circle cx="0" cy="-4" r="4.5" fill="#FFC80F" class="pulse-dot" />
      <text x="14" y="0" class="title-text">Most Used Languages</text>
    </g>

    <!-- Top Segmented Bar -->
    <g transform="translate(20, 50)">
      <mask id="lang-bar-mask">
        <rect x="0" y="0" width="375" height="9" rx="4.5" fill="#FFFFFF" />
      </mask>
      <g mask="url(#lang-bar-mask)">
        <rect x="0" y="0" width="158" height="9" fill="#38BDF8" />
        <rect x="158" y="0" width="98" height="9" fill="#7C3AED" />
        <rect x="256" y="0" width="67" height="9" fill="#FACC15" />
        <rect x="323" y="0" width="34" height="9" fill="#2563EB" />
        <rect x="357" y="0" width="18" height="9" fill="#F97316" />
      </g>
    </g>

    <!-- Languages Legend: Col 1 -->
    <g transform="translate(20, 84)">
      <g transform="translate(0, 0)">
        <circle cx="4" cy="-4" r="4.5" fill="#38BDF8" />
        <text x="16" y="0" class="item-label">Python</text>
        <text x="160" y="0" text-anchor="end" class="item-value">42.0%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="4" cy="-4" r="4.5" fill="#7C3AED" />
        <text x="16" y="0" class="item-label">Lua</text>
        <text x="160" y="0" text-anchor="end" class="item-value">26.0%</text>
      </g>
      <g transform="translate(0, 64)">
        <circle cx="4" cy="-4" r="4.5" fill="#FACC15" />
        <text x="16" y="0" class="item-label">JS / TypeScript</text>
        <text x="160" y="0" text-anchor="end" class="item-value">18.0%</text>
      </g>
    </g>

    <!-- Languages Legend: Col 2 -->
    <g transform="translate(225, 84)">
      <g transform="translate(0, 0)">
        <circle cx="4" cy="-4" r="4.5" fill="#2563EB" />
        <text x="16" y="0" class="item-label">C++ / C</text>
        <text x="160" y="0" text-anchor="end" class="item-value">9.0%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="4" cy="-4" r="4.5" fill="#F97316" />
        <text x="16" y="0" class="item-label">HTML / CSS</text>
        <text x="160" y="0" text-anchor="end" class="item-value">5.0%</text>
      </g>
      <g transform="translate(0, 64)">
        <circle cx="4" cy="-4" r="4.5" fill="#10B981" />
        <text x="16" y="0" class="item-label">SQL / Automation</text>
        <text x="160" y="0" text-anchor="end" class="item-value">Active</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: NAVIGATION & SYSTEM METRICS (x: 435, width: 415, height: 195) ==================== -->
  <g transform="translate(435, 0)">
    <!-- Base Frame (Identical height=195, identical rx=6) -->
    <rect width="415" height="195" rx="6" fill="url(#card-bg)" stroke="#30363D" stroke-width="1" />

    <!-- Title & Beacon -->
    <g transform="translate(20, 32)">
      <circle cx="0" cy="-4" r="4.5" fill="#38BDF8" class="pulse-dot" />
      <text x="14" y="0" class="title-text">Navigation &amp; System Metrics</text>
    </g>
    <g transform="translate(390, 28)">
      <circle cx="0" cy="0" r="3" fill="#10B981" class="pulse-dot" />
      <text x="-8" y="3" text-anchor="end" font-family="'Fira Code', monospace" font-size="9" fill="#10B981">LIVE</text>
    </g>

    <!-- Metric 1 -->
    <g transform="translate(20, 52)">
      <text x="0" y="0" class="item-label">System Architecture</text>
      <text x="375" y="0" text-anchor="end" class="item-value">Resilient // 99.8%</text>
      <rect x="0" y="6" width="375" height="5" rx="2.5" fill="#21262D" />
      <rect x="0" y="6" width="365" height="5" rx="2.5" fill="url(#bar-gold)" />
    </g>

    <!-- Metric 2 -->
    <g transform="translate(20, 88)">
      <text x="0" y="0" class="item-label">Algorithm Optimization</text>
      <text x="375" y="0" text-anchor="end" class="item-value">Optimal // O(log n)</text>
      <rect x="0" y="6" width="375" height="5" rx="2.5" fill="#21262D" />
      <rect x="0" y="6" width="335" height="5" rx="2.5" fill="url(#bar-blue)" />
    </g>

    <!-- Metric 3 -->
    <g transform="translate(20, 124)">
      <text x="0" y="0" class="item-label">Maritime Computation &amp; NtM</text>
      <text x="375" y="0" text-anchor="end" class="item-value">Active // Synchronized</text>
      <rect x="0" y="6" width="375" height="5" rx="2.5" fill="#21262D" />
      <rect x="0" y="6" width="370" height="5" rx="2.5" fill="url(#bar-gold)" />
    </g>

    <!-- Metric 4 -->
    <g transform="translate(20, 160)">
      <text x="0" y="0" class="item-label">Operational Status</text>
      <text x="375" y="0" text-anchor="end" class="item-value">Voyage Active // Nominal</text>
      <rect x="0" y="6" width="375" height="5" rx="2.5" fill="#21262D" />
      <rect x="0" y="6" width="375" height="5" rx="2.5" fill="url(#bar-green)" />
    </g>
  </g>

</svg>