<svg width="100%" height="130" viewBox="0 0 850 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient matching Header -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="footer-border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFC80F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0.5" />
    </linearGradient>

    <!-- Radar Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC80F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFC80F" stop-opacity="0" />
    </linearGradient>

    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style><![CDATA[
      .radar-sweep {
        animation: spinRadar 6s linear infinite;
        transform-origin: 75px 65px;
      }
      @keyframes spinRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .compass-ring {
        animation: spinCompass 24s linear infinite reverse;
        transform-origin: 75px 65px;
      }
      @keyframes spinCompass {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .sonar-pulse {
        animation: pulseSonar 2.8s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: 75px 65px;
      }
      @keyframes pulseSonar {
        0% { r: 5px; opacity: 1; }
        70% { r: 42px; opacity: 0; }
        100% { r: 42px; opacity: 0; }
      }

      .pulse-green {
        animation: liveBlink 1.8s infinite ease-in-out;
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Frame Base -->
  <rect width="850" height="130" rx="14" fill="url(#footer-bg)" stroke="url(#footer-border-glow)" stroke-width="1.2" />

  <!-- Subtle Cyber/Nautical Grid Lines -->
  <g stroke="#30363D" stroke-opacity="0.25" stroke-dasharray="3 3">
    <line x1="150" y1="20" x2="150" y2="110" />
    <line x1="600" y1="20" x2="600" y2="110" />
  </g>

  <!-- ==================== LEFT: ROTATING TACTICAL GYRO & RADAR HUD ==================== -->
  <g transform="translate(0, 0)">
    <!-- Outer Degree Ring -->
    <circle cx="75" cy="65" r="44" stroke="#30363D" stroke-width="1" stroke-dasharray="3 4" />
    <circle cx="75" cy="65" r="32" stroke="#FFC80F" stroke-width="0.8" opacity="0.4" class="compass-ring" stroke-dasharray="6 6" />
    <circle cx="75" cy="65" r="18" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />

    <!-- Sonar Ripple -->
    <circle cx="75" cy="65" r="6" stroke="#FFC80F" stroke-width="1.2" fill="none" class="sonar-pulse" />

    <!-- Crosshairs -->
    <line x1="30" y1="65" x2="120" y2="65" stroke="#30363D" stroke-width="0.8" />
    <line x1="75" y1="20" x2="75" y2="110" stroke="#30363D" stroke-width="0.8" />

    <!-- Cardinal Marks -->
    <text x="75" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#FFC80F">N</text>
    <text x="75" y="122" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#64748B">S</text>
    <text x="127" y="68" text-anchor="start" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#64748B">E</text>
    <text x="23" y="68" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#64748B">W</text>

    <!-- Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M75 65 L117 48 A44 44 0 0 1 119 65 Z" fill="url(#beam-grad)" opacity="0.7" />
      <line x1="75" y1="65" x2="119" y2="65" stroke="#FFC80F" stroke-width="1.5" />
    </g>

    <!-- Center Pivot Core -->
    <circle cx="75" cy="65" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- ==================== CENTER: PHILOSOPHY & SIGNATURE ==================== -->
  <g transform="translate(170, 36)">
    <!-- Header -->
    <text x="0" y="0" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#FFC80F" letter-spacing="1.2">
      NAVIGATION TERMINAL <tspan fill="#64748B">//</tspan> <tspan fill="#38BDF8">BRIDGE STATION</tspan>
    </text>

    <!-- Quote -->
    <text x="0" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">
      "Smooth seas never made a skilled sailor."
    </text>

    <!-- Signature -->
    <text x="0" y="48" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">
      Yiğit Alp Sarı <tspan font-weight="400" fill="#64748B">• Crafted with code, navigation &amp; curiosity © 2026</tspan>
    </text>
  </g>

  <!-- ==================== RIGHT: TELEMETRY & LIVE STATUS ==================== -->
  <g transform="translate(620, 32)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="195" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10B981" class="pulse-green" />
    <text x="28" y="17" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#10B981" letter-spacing="0.5">ONLINE // 24/7 ACTIVE</text>

    <!-- Live Telemetry Coordinates -->
    <text x="2" y="44" font-family="'Fira Code', monospace" font-size="10" fill="#8B949E">
      HDG: <tspan fill="#FFC80F">042° TRUE</tspan> | LAT: 41°00'N
    </text>
    <text x="2" y="58" font-family="'Fira Code', monospace" font-size="10" fill="#8B949E">
      LON: 028°58'E | SYS: <tspan fill="#10B981">NOMINAL</tspan>
    </text>
  </g>
</svg>