<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="telemetry-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="bar-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC80F" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>

    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <style><![CDATA[
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
        font-weight: 700;
        font-size: 17px;
        fill: #FFC80F;
      }
      .metric-label {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #E6EDF3;
      }
      .metric-val {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #8B949E;
      }
      .pulse-dot {
        animation: pulseLive 2s infinite ease-in-out;
      }
      @keyframes pulseLive {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Card Frame (Exact 495x195 matching GitHub Stats) -->
  <rect width="495" height="195" rx="6" fill="url(#telemetry-card-bg)" stroke="#30363D" stroke-width="1" />

  <!-- Title Header -->
  <g transform="translate(25, 34)">
    <circle cx="0" cy="-4" r="5" fill="#38BDF8" class="pulse-dot" />
    <text x="14" y="0" class="title-text">Navigation &amp; System Metrics</text>
  </g>

  <!-- Live Green Beacon on Right -->
  <g transform="translate(465, 30)">
    <circle cx="0" cy="0" r="3.5" fill="#10B981" class="pulse-dot" />
    <text x="-8" y="3" text-anchor="end" font-family="'Fira Code', monospace" font-size="9" fill="#10B981">LIVE</text>
  </g>

  <!-- Metric 1: System Architecture (y=56) -->
  <g transform="translate(25, 54)">
    <text x="0" y="0" class="metric-label">System Architecture</text>
    <text x="445" y="0" text-anchor="end" class="metric-val">Resilient // 99.8%</text>
    <rect x="0" y="6" width="445" height="5.5" rx="2.75" fill="#21262D" />
    <rect x="0" y="6" width="435" height="5.5" rx="2.75" fill="url(#bar-gold)" />
  </g>

  <!-- Metric 2: Algorithm Optimization (y=92) -->
  <g transform="translate(25, 90)">
    <text x="0" y="0" class="metric-label">Algorithm Optimization</text>
    <text x="445" y="0" text-anchor="end" class="metric-val">Optimal // O(log n)</text>
    <rect x="0" y="6" width="445" height="5.5" rx="2.75" fill="#21262D" />
    <rect x="0" y="6" width="395" height="5.5" rx="2.75" fill="url(#bar-blue)" />
  </g>

  <!-- Metric 3: Maritime Software & Tools (y=128) -->
  <g transform="translate(25, 126)">
    <text x="0" y="0" class="metric-label">Maritime Computation &amp; NtM</text>
    <text x="445" y="0" text-anchor="end" class="metric-val">Active // Synchronized</text>
    <rect x="0" y="6" width="445" height="5.5" rx="2.75" fill="#21262D" />
    <rect x="0" y="6" width="440" height="5.5" rx="2.75" fill="url(#bar-gold)" />
  </g>

  <!-- Metric 4: Operational Status (y=164) -->
  <g transform="translate(25, 162)">
    <text x="0" y="0" class="metric-label">Operational Status</text>
    <text x="445" y="0" text-anchor="end" class="metric-val">Voyage Active // Nominal</text>
    <rect x="0" y="6" width="445" height="5.5" rx="2.75" fill="#21262D" />
    <rect x="0" y="6" width="445" height="5.5" rx="2.75" fill="url(#bar-green)" />
  </g>
</svg>